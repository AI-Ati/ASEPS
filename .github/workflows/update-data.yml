name: Auto-Update ABS Economic Data

on:
  schedule:
    # Runs quarterly: 1st of January, April, July, October at 02:00 UTC
    - cron: '0 2 1 1,4,7,10 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-abs-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest ABS data
        run: node scripts/fetch-abs-data.js
        env:
          NODE_ENV: production

      - name: Validate fetched data
        run: node scripts/validate-data.js

      - name: Check for data changes
        id: diff
        run: |
          if git diff --quiet src/data/key_metrics.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.email "aseps-bot@github-actions"
          git config --local user.name "ASEPS Data Bot"
          git add src/data/key_metrics.json
          git commit -m "auto: ABS data refresh $(date +%Y-%m-%d)

          - Updated key economic metrics from ABS SDMX API
          - Sources: ABS 6202.0 Labour Force, ABS 6401.0 CPI
          - Reference periods: see _meta.auto_reference_periods
          
          [automated]"
          git push

      - name: Create manual review issue
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Manual pathway review due — ${today}`,
              body: `## ASEPS Quarterly Data Update Complete
              
              The automated ABS data fetch has completed for **${today}**.
              
              ### What was updated automatically:
              - \`src/data/key_metrics.json\` — State unemployment rate and annual CPI inflation
              
              ### What requires manual review:
              - [ ] \`src/data/deep_pathways.json\` — Check if new issues have emerged / pathways need updating
              - [ ] \`src/data/solow_params.json\` — Recalibrate α, s, δ, n, g from latest ABS 5204.0 and 5209.0.55.001
              - [ ] Victoria section: Cross-check against latest Victorian Budget papers and DTF Snapshot
              - [ ] Verify all source URLs are still live and pointing to latest release
              - [ ] Update \`_meta.generated\` timestamps in all JSON files
              
              ### Data sources to check:
              - [ABS State Accounts](https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-state-accounts/latest-release)
              - [Victorian Budget Papers](https://www.budget.vic.gov.au/)
              - [Victorian DTF Economic Snapshot](https://www.dtf.vic.gov.au/economic-development/victorias-economy/victorian-economic-snapshot)
              - [RBA Statistical Tables](https://www.rba.gov.au/statistics/tables/)
              - [Productivity Commission Reports](https://www.pc.gov.au/research)
              
              **Please close this issue after completing manual review.**`,
              labels: ['data-update', 'manual-review-required']
            });

      - name: Deploy to GitHub Pages
        if: steps.diff.outputs.changed == 'true'
        run: npm run build
        env:
          NODE_ENV: production
